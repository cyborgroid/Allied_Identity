[package]
name = "allied-id"
version = "0.1.0"
edition = "2021"
description = "Allied Identity (AlliedID) - offline-first personal identity partner"
publish = false

[[bin]]
name = "AlliedID"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

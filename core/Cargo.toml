[package]
name = "allied-core"
version = "0.2.0"
edition = "2021"
description = "Allied Identity 본체 — 인지 엔진 (의도 이해, 추론 루프, 지식, 학습)"
publish = false

[lib]
name = "allied_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
